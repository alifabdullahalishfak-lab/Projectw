<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; transition: all 0.2s; }
        .card:hover { border-color: #3b82f6; }
        .stat-label { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        input, select { background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; padding: 8px; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-end mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-semibold tracking-tight">Project Management Board</h1>
                <p class="text-slate-400 mt-2">Freelance revenue and deadline tracking</p>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full md:w-auto">
                <div class="card p-4 min-w-[140px]">
                    <p class="stat-label">Fiverr</p>
                    <p class="text-xl font-bold text-green-400">$0</p>
                </div>
                <div class="card p-4 min-w-[140px]">
                    <p class="stat-label">Upwork</p>
                    <p class="text-xl font-bold text-green-400">$0</p>
                </div>
                <div class="card p-4 min-w-[140px]">
                    <p class="stat-label">Outside</p>
                    <p class="text-xl font-bold text-green-400">$0</p>
                </div>
                <div class="card p-4 min-w-[140px] border-blue-500/50">
                    <p class="stat-label">Total Revenue</p>
                    <p class="text-xl font-bold text-blue-400">$0</p>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6 bg-slate-800/50 p-4 rounded-lg">
            <div class="text-sm text-slate-400">0 Active Projects</div>
            <button class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg font-medium transition flex items-center gap-2">
                <span>+</span> New Project
            </button>
        </div>

        <div class="overflow-x-auto card">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-slate-700 bg-slate-800/30">
                        <th class="p-4 text-xs font-semibold text-slate-400 uppercase">Project</th>
                        <th class="p-4 text-xs font-semibold text-slate-400 uppercase">Status</th>
                        <th class="p-4 text-xs font-semibold text-slate-400 uppercase">Client</th>
                        <th class="p-4 text-xs font-semibold text-slate-400 uppercase text-center">Priority</th>
                        <th class="p-4 text-xs font-semibold text-slate-400 uppercase text-right">Price</th>
                        <th class="p-4 text-xs font-semibold text-slate-400 uppercase text-right">Time Left</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="p-20 text-center text-slate-500 italic">
                            No projects currently in the pipeline.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
